name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security issues, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: shntool version
      description: Output of `shntool -v`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command line used
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the output and the exit code
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: OS, architecture, compiler, and any helper programs involved
    validations:
      required: true
